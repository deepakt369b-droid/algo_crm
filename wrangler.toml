name = "flowlinepro-app"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]
pages_build_output_dir = ".open-next/assets"

[vars]
NEXT_PUBLIC_SUPABASE_URL = "your-supabase-url"
NEXT_PUBLIC_SUPABASE_ANON_KEY = "your-supabase-anon-key"
DATABASE_URL = "your-postgres-database-url"
STRIPE_SECRET_KEY = "your-stripe-secret"
STRIPE_WEBHOOK_SECRET = "your-stripe-webhook-secret"
WORKER_MAILER_URL = "https://worker-mailer.yourdomain.workers.dev"
WORKER_MAILER_API_KEY = "your-mailer-api-key"
WHATSAPP_API_URL = "http://your-multiwa-server:3001"
WHATSAPP_API_KEY = "your-multiwa-api-key"
